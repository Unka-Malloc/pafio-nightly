name: local-ci-gate

on:
  pull_request:
  push:
    branches:
      - ai-dev
      - nightly
      - stable
      - main
      - master
  merge_group:
  workflow_dispatch:
    inputs:
      native_process_only:
        description: Run only the Windows CLI and process-contract checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-debian-trixie:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_process_only
    name: Linux / Debian 13 trixie gate
    # GitHub-hosted Linux runner is only the container host; toolchain commands run in Debian 13.
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 75
    env:
      STYIO_LLVM_MAJOR: "18"
      STYIO_CMAKE_VERSION: "3.31.6"
      STYIO_PYTHON_VERSION: "3.13.5"

    steps:
      - name: Install Debian checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            git

      - name: Verify Debian trixie execution baseline
        run: |
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13

      - name: Checkout pafio-nightly
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: pafio-nightly

      - name: Resolve sibling repository refs
        id: sibling_refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          CANDIDATE_REF="nightly"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            CANDIDATE_REF="$PR_HEAD_REF"
          elif [[ "$REF_TYPE" == "branch" ]]; then
            CANDIDATE_REF="$REF_NAME"
          fi

          resolve_ref() {
            local repository="$1"
            if git ls-remote --exit-code --heads \
              "https://github.com/Unka-Malloc/${repository}.git" \
              "refs/heads/${CANDIDATE_REF}" >/dev/null 2>&1; then
              printf '%s\n' "${CANDIDATE_REF}"
            else
              printf '%s\n' "nightly"
            fi
          }

          echo "styio=$(resolve_ref styio-nightly)" >> "$GITHUB_OUTPUT"
          echo "vityo=$(resolve_ref vityo-nightly)" >> "$GITHUB_OUTPUT"

      - name: Checkout styio-nightly sibling repository
        uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/styio-nightly
          ref: ${{ steps.sibling_refs.outputs.styio }}
          path: styio-nightly

      - name: Checkout Vityo sibling repository
        uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/vityo-nightly
          ref: ${{ steps.sibling_refs.outputs.vityo }}
          path: vityo-nightly

      - name: Bootstrap Debian trixie toolchain
        working-directory: pafio-nightly
        run: |
          ./scripts/bootstrap-dev-env.sh
          echo "$HOME/.local/venvs/pafio-nightly-tools/bin" >> "$GITHUB_PATH"

      - name: Verify standardized toolchain
        run: |
          python3 --version
          cmake --version | head -n1
          ctest --version | head -n1
          clang-${STYIO_LLVM_MAJOR} --version | head -n1
          llvm-config-${STYIO_LLVM_MAJOR} --version

      - name: Resolve CI refs
        id: ci_refs
        shell: bash
        working-directory: pafio-nightly
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
              RANGE="HEAD^..HEAD"
            else
              BASE_REF="HEAD"
              RANGE="HEAD"
            fi
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
            else
              BASE_REF="HEAD"
            fi
            RANGE="HEAD"
          else
            BASE_REF="${{ github.event.before }}"
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Run pafio-nightly local CI gate
        working-directory: pafio-nightly
        run: >
          ./scripts/delivery-gate.sh
          --mode push
          --base "${{ steps.ci_refs.outputs.base_ref }}"
          --range "${{ steps.ci_refs.outputs.range }}"
          --skip-audit
          --skip-health

      - name: Run unified submit gate
        working-directory: pafio-nightly
        run: python3 scripts/submit-gate.py --profile ci --json

  macos-native-smoke:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_process_only
    name: macOS / latest native smoke
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pafio-nightly
        uses: actions/checkout@v5
        with:
          path: pafio-nightly

      - name: Verify macOS host toolchain
        run: |
          sw_vers
          uname -m
          cmake --version | head -n1
          python3 --version

      - name: Configure native build
        run: cmake -S pafio-nightly -B pafio-nightly/build-ci-macos -DPAFIO_BUILD_TESTS=ON

      - name: Build native targets
        run: cmake --build pafio-nightly/build-ci-macos --parallel 4

      - name: Run native tests
        run: ctest --test-dir pafio-nightly/build-ci-macos --output-on-failure

  windows-native-smoke:
    name: Windows / latest native smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pafio-nightly
        uses: actions/checkout@v5
        with:
          path: pafio-nightly

      - name: Verify Windows host toolchain
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          cmake --version
          where.exe cl
          if ($LASTEXITCODE -ne 0) {
            "cl.exe is not on PATH; CMake will query the Visual Studio toolchain installation."
            $global:LASTEXITCODE = 0
          }

      - name: Configure native build
        shell: pwsh
        run: cmake -S pafio-nightly -B pafio-nightly/build-ci-windows -A x64 -DPAFIO_BUILD_TESTS=ON

      - name: Build native CLI
        shell: pwsh
        run: cmake --build pafio-nightly/build-ci-windows --config Debug --target pafio pafio_process_tests --parallel 4

      - name: Verify native process contracts
        shell: pwsh
        run: ctest --test-dir pafio-nightly/build-ci-windows --build-config Debug --tests-regex '^PortableProcess\.' --output-on-failure

      - name: Probe native CLI
        shell: pwsh
        run: |
          $pafio = "pafio-nightly/build-ci-windows/bin/Debug/pafio.exe"
          if (!(Test-Path $pafio)) {
            $match = Get-ChildItem -Path pafio-nightly/build-ci-windows -Filter pafio.exe -Recurse | Select-Object -First 1
            if ($null -eq $match) {
              throw "pafio.exe was not produced"
            }
            $pafio = $match.FullName
          }
          & $pafio --version
          & $pafio machine-info --json
