name: secret-scan

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: secret-scan
    # GitHub-hosted Linux runner is only the container host; commands run in Debian 13.
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 10

    steps:
      - name: Install Debian checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            python3

      - name: Verify Debian trixie execution baseline
        run: |
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13

      - name: Checkout Pafio
        uses: actions/checkout@v5

      - name: Run repository-local secret scan
        run: python3 scripts/secret-scan.py
