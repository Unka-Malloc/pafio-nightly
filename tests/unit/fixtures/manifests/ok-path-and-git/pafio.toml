[pafio]
manifest-version = 1

[package]
name = "acme/app"
version = "0.2.0"
edition = "2026"
publish = false

[build]
implicit-std = true

[[bin]]
name = "app"
path = "src/main.styio"

[dependencies]
core = { package = "acme/core", path = "../core" }
feed = { package = "acme/feed", git = "https://example.com/feed.git", rev = "4f2c9b1e0a8d3c5f7b9e2a4d6c8f0b1d3e5a7c9f" }
